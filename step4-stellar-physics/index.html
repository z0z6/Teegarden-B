<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Game — Krok 4: Układ potrójny</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      height: 100%;
    }
    canvas {
      display: block;
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      color: #9fd8ff;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      opacity: 0.85;
      pointer-events: none;
      text-shadow: 0 0 6px rgba(0, 150, 255, 0.6);
      line-height: 1.6;
    }
    #hud .ship-name {
      font-size: 15px;
      font-weight: 600;
      color: #d9f3ff;
    }
    #hud .dim {
      opacity: 0.7;
    }
    #loading-model {
      position: fixed;
      top: 12px;
      right: 12px;
      color: #9fd8ff;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      text-shadow: 0 0 6px rgba(0, 150, 255, 0.6);
    }
    #loading-model.visible {
      opacity: 0.9;
    }

    /* ============================================================
       UI DOTYKOWE (Android/mobile) - widoczne TYLKO na urządzeniach,
       gdzie główny wskaźnik to dotyk (pointer: coarse). Na desktopie
       z myszą ten cały blok jest ukryty przez media query niżej, więc
       nie przeszkadza graczom na klawiaturze/myszy.
       Schemat "twin-stick": lewy joystick = celowanie (pitch/yaw),
       prawy joystick = przechył (X) + ciąg (Y). touch-action: none
       jest konieczne, żeby przeglądarka nie próbowała przewijać/
       przybliżać strony przy przeciąganiu palcem po joysticku.
       ============================================================ */
    #touch-controls { display: none; }
    @media (pointer: coarse) {
      #touch-controls { display: block; }
      #hud .dim.desktop-only { display: none; }
    }

    .joystick-zone {
      position: fixed;
      bottom: 28px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(159, 216, 255, 0.08);
      border: 1px solid rgba(159, 216, 255, 0.25);
      touch-action: none;
      z-index: 20;
    }
    #touch-left-zone { left: 24px; }
    #touch-right-zone { right: 24px; }
    .joystick-knob {
      position: absolute;
      top: 50%; left: 50%;
      width: 56px; height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      background: rgba(159, 216, 255, 0.35);
      border: 1px solid rgba(217, 243, 255, 0.6);
      pointer-events: none;
      transition: transform 0.02s linear;
    }

    .touch-btn {
      position: fixed;
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(159, 216, 255, 0.12);
      border: 1px solid rgba(159, 216, 255, 0.35);
      color: #d9f3ff;
      font-family: 'Segoe UI', sans-serif;
      font-size: 11px;
      display: flex; align-items: center; justify-content: center;
      touch-action: none;
      z-index: 20;
      user-select: none;
    }
    .touch-btn:active { background: rgba(159, 216, 255, 0.3); }
    #touch-boost { right: 110px; bottom: 175px; }
    #touch-brake { right: 24px; bottom: 175px; }
    #touch-ship-switch {
      position: fixed; top: 12px; right: 12px; z-index: 20;
      width: auto; height: auto; padding: 8px 14px; border-radius: 8px;
      background: rgba(159, 216, 255, 0.12); border: 1px solid rgba(159, 216, 255, 0.35);
      color: #d9f3ff; font-family: 'Segoe UI', sans-serif; font-size: 12px;
    }
  </style>

  <!-- Importmap: three@0.184.0 (ta sama wersja co w narzędziach, którymi
       generowaliśmy modele statków — trzymamy to spójne w całym repo) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <div class="ship-name" id="ship-name">—</div>
    <div class="dim desktop-only">Mysz — celowanie · W/S — ciąg · A/D — przechył (roll)</div>
    <div class="dim desktop-only">Shift — boost · Spacja — hamulec · 1-4 — zaokrętuj na inny statek</div>
    <div class="dim">Układ potrójny: gwiazda G + biały karzeł (ciasna para) + czerwony olbrzym (orbita zewn.)</div>
  </div>
  <div id="loading-model">Cumowanie… ładowanie statku</div>

  <div id="touch-controls">
    <div class="joystick-zone" id="touch-left-zone"><div class="joystick-knob" id="touch-left-knob"></div></div>
    <div class="joystick-zone" id="touch-right-zone"><div class="joystick-knob" id="touch-right-knob"></div></div>
    <div class="touch-btn" id="touch-boost">BOOST</div>
    <div class="touch-btn" id="touch-brake">STOP</div>
    <div class="touch-btn" id="touch-ship-switch">Zmień statek</div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
