<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wizerunki ras — Teegarden-B</title>
  <style>
    body { margin: 0; padding: 20px 24px 40px; background: #05080e; color: #d9f3ff; font-family: 'Segoe UI', system-ui, sans-serif; }
    h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
    .lead { margin: 0 0 18px; max-width: 70ch; font-size: 13px; line-height: 1.5; opacity: 0.7; }
    .race { display: grid; grid-template-columns: 180px repeat(3, auto) 1fr; gap: 14px; align-items: start; padding: 14px 0; border-top: 1px solid rgba(159, 216, 255, 0.12); }
    .race h2 { margin: 0; font-size: 16px; }
    .race p { margin: 4px 0 0; font-size: 12px; line-height: 1.45; opacity: 0.7; }
    figure { margin: 0; text-align: center; }
    figure svg { display: block; border-radius: 12px; border: 1px solid rgba(159, 216, 255, 0.2); }
    figcaption { margin-top: 5px; font-size: 11.5px; opacity: 0.75; }
    .variants { display: flex; gap: 6px; flex-wrap: wrap; align-self: center; }
    .variants svg { border-radius: 8px; border: 1px solid rgba(159, 216, 255, 0.15); }
    @media (max-width: 800px) { .race { grid-template-columns: 1fr 1fr; } .race > div:first-child { grid-column: 1 / -1; } .variants { grid-column: 1 / -1; } }
  </style>
  <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.184.0/build/three.module.js" } }</script>
</head>
<body>
  <h1>Wizerunki ras</h1>
  <p class="lead">Portrety przedstawicieli siedmiu ras w trzech stronnictwach, plus kilku losowych osobników. Te same portrety pokazuje komunikator w grze. Generator: <code>shared/data/race-portraits.js</code>.</p>
  <div id="list"></div>
  <script type="module">
    import { racePortrait, PORTRAIT_RACES } from '../../shared/data/race-portraits.js';
    import { RACES } from '../../shared/data/races.js';
    const NOTES = {
      wybudzeni: 'Ciężkie powieki dopiero co przebudzonych, numer ewidencyjny na czole. „Bez Numeru” ma bliznę po wypalonym kodzie.',
      rezonanci: 'Kryształ z komorą rezonansową zamiast ust. „Szczyt Okna” nosi koronę, „Przesypiający” mają przygaszone oczy.',
      piesniarze: 'Grzebień piór, czworo oczu, worek krtaniowy do śpiewu. „Szpony” mają czerwone końce piór, „Kukułki” — cętki.',
      szczepieni: 'Szwy przeszczepów, świecące guzki kolonii, maska filtrująca, oko-skaner. „Izba Kwarantanny” nosi przezroczysty hełm.',
      wykonawcy: 'Płyta twarzowa z wierszami klauzul i skanujący wizjer. „Rewizjoniści” skreślają klauzule.',
      heliotropi: 'Gadzia twarz w kryzie płatków. „Żar” — płatki rozżarzone, „Chłodni” — blade, „Hibernatorzy” — złożone.',
      swietlisci: 'Bioluminescencyjne wzory pod skórą. Maska zależy od stronnictwa: czerwona, brak albo złota.',
    };
    const list = document.getElementById('list');
    for (const id of PORTRAIT_RACES) {
      const race = RACES[id];
      const row = document.createElement('section');
      row.className = 'race';
      let html = `<div><h2 style="color:${race.color}">${race.name}</h2><p>${NOTES[id]}</p></div>`;
      for (const f of ['hawk', 'trade', 'coalition']) {
        html += `<figure>${racePortrait(id, { seed: 1, faction: f, size: 132, color: race.color })}<figcaption>${race.factions[f]}</figcaption></figure>`;
      }
      html += `<div class="variants">${[2, 3, 4, 5, 6, 7].map((s) => racePortrait(id, { seed: s * 13.7, faction: 'trade', size: 60, color: race.color })).join('')}</div>`;
      row.innerHTML = html;
      list.appendChild(row);
    }
    window.__ready = true;
  </script>
</body>
</html>
