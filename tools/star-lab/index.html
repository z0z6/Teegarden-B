<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laboratorium gwiazd — Teegarden-B</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
    #panel {
      position: fixed; left: 12px; top: 12px; width: 250px; padding: 10px 12px; box-sizing: border-box;
      color: #d9f3ff; font: 13px 'Segoe UI', sans-serif;
      background: rgba(6, 14, 24, 0.72); border: 1px solid rgba(159, 216, 255, 0.25); border-radius: 8px;
    }
    #panel h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
    #panel .group { margin: 8px 0 4px; font-size: 11px; opacity: 0.6; }
    #panel button {
      display: block; width: 100%; margin: 3px 0; padding: 5px 8px; text-align: left; cursor: pointer;
      color: #d9f3ff; font: inherit; background: rgba(159, 216, 255, 0.08);
      border: 1px solid rgba(159, 216, 255, 0.25); border-radius: 5px;
    }
    #panel button.on { background: rgba(159, 216, 255, 0.28); border-color: #9fd8ff; }
    #panel .row { display: flex; gap: 4px; }
    #panel .row button { text-align: center; }
    #hint { margin-top: 8px; font-size: 11px; opacity: 0.6; line-height: 1.4; }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="panel">
    <h1>Laboratorium gwiazd</h1>
    <div class="group">Typ gwiazdy</div>
    <div id="types"></div>
    <div class="group">Odległość</div>
    <div class="row" id="dists"></div>
    <div class="group">Zdarzenia</div>
    <button id="flare">Wywołaj rozbłysk</button>
    <button id="tide">Deformacja pływowa: wył.</button>
    <div id="hint">Mysz — obrót i przybliżenie. Narzędzie deweloperskie: podgląd powierzchni, korony i protuberancji każdego typu gwiazdy (shared/systems/star-surface.js).</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
