name: Usuń stare statki (jednorazowo)

# Jednorazowe sprzątanie: usuwa cztery pierwsze statki (Warbird lekki, Raptor,
# Warbird ciężki, Kharath) - modele, generatory i wpisy we fleet.js/races.js.
# Po udanym uruchomieniu ten plik można skasować.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sprawdź, czy misje są już przepięte na nowe statki
        shell: bash
        run: |
          if grep -nE "warbird-light|raptor-interceptor|warbird-heavy|kharath-destroyer" shared/systems/missions.js cover/missions.js tools/ship-gallery/main.js; then
            echo "::error::Najpierw wgraj paczkę z poprawionymi plikami (misje nadal używają starych statków)."
            exit 1
          fi

      - name: Usuń modele i generatory
        shell: bash
        run: |
          for id in warbird-light raptor-interceptor warbird-heavy kharath-destroyer; do
            git rm -q --ignore-unmatch shared/ships/models/$id-lod0.glb shared/ships/models/$id-lod1.glb shared/ships/models/$id-lod2.glb
          done
          git rm -q --ignore-unmatch \
            shared/ships/source/warbird_light.js shared/ships/source/raptor_interceptor.js \
            shared/ships/source/warbird_heavy.js shared/ships/source/kharath_destroyer.js

      - name: Usuń wpisy z fleet.js, races.js i przykład z manifestu
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const OLD = ['warbird-light', 'raptor-interceptor', 'warbird-heavy', 'kharath-destroyer'];
          const esc = (s) => s.replace(/[-]/g, '\\-');
          let fleet = readFileSync('shared/ships/fleet.js', 'utf8');
          let races = readFileSync('shared/data/races.js', 'utf8');
          for (const id of OLD) {
            fleet = fleet.replace(new RegExp(`\\n  \\{\\n    id: '${esc(id)}',[\\s\\S]*?\\n  \\},`), '');
            races = races.replace(new RegExp(`\\n  '${esc(id)}': '[a-z]+',`), '');
          }
          writeFileSync('shared/ships/fleet.js', fleet);
          writeFileSync('shared/data/races.js', races);
          let man = readFileSync('shared/ships/source/ships.manifest.js', 'utf8');
          man = man.replace(/\n    \/\/ Istniejące generatory też działają \(bez opts\):\n(    \/\/.*\n)+/, '\n');
          writeFileSync('shared/ships/source/ships.manifest.js', man);
          JS

      - name: Kontrola
        shell: bash
        run: |
          npm install --no-save --no-package-lock three@0.184.0 >/dev/null
          node --input-type=module <<'JS'
          const { SHIPS } = await import(process.cwd() + '/shared/ships/fleet.js');
          const { SHIP_RACE, RACES } = await import(process.cwd() + '/shared/data/races.js');
          const OLD = ['warbird-light', 'raptor-interceptor', 'warbird-heavy', 'kharath-destroyer'];
          const left = OLD.filter((id) => SHIPS.some((s) => s.id === id) || id in SHIP_RACE);
          if (left.length) { console.error('Zostały wpisy:', left); process.exit(1); }
          if (!SHIPS.length) { console.error('Flota jest pusta!'); process.exit(1); }
          const noRace = SHIPS.filter((s) => !RACES[SHIP_RACE[s.id]]).map((s) => s.id);
          if (noRace.length) { console.error('Statki bez rasy:', noRace); process.exit(1); }
          console.log(`Flota po sprzątaniu: ${SHIPS.length} statków`);
          for (const s of SHIPS) console.log(`  ${s.id}  (${SHIP_RACE[s.id]})`);
          JS
          node step9-missions/check.mjs | tail -3
          {
            echo '## Stare statki usunięte'
            echo '```'
            git status --short | sed 's/^/  /'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A shared
          if git diff --cached --quiet; then
            echo "Nic do usunięcia - już posprzątane."
          else
            git commit -m "ships: usunięte stare statki (warbird-light, raptor-interceptor, warbird-heavy, kharath-destroyer)"
            git push
          fi
