name: Build ships

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = tylko test, build = zapisz .glb, patch = .glb + wpisy w fleet.js/races.js'
        type: choice
        options: [dry, build, patch]
        default: dry
      only:
        description: 'Tylko te id (po przecinku, puste = wszystkie z manifestu)'
        type: string
        default: ''
      lod:
        description: 'Generuj LOD1 i LOD2'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja three + gltfpack
        run: npm install --no-save --no-package-lock three@0.184.0 gltfpack

      - name: Generowanie statków
        run: |
          ARGS=""
          [ "${{ inputs.mode }}" = "dry" ] && ARGS="$ARGS --dry"
          [ "${{ inputs.mode }}" = "patch" ] && ARGS="$ARGS --patch"
          [ "${{ inputs.lod }}" = "false" ] && ARGS="$ARGS --no-lod"
          [ -n "${{ inputs.only }}" ] && ARGS="$ARGS --only ${{ inputs.only }}"
          echo "node shared/ships/source/build-ships.mjs $ARGS"
          node shared/ships/source/build-ships.mjs $ARGS | tee build-log.txt
          {
            echo '## Build ships (${{ inputs.mode }})'
            echo '```'
            cat build-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Paczka modeli do pobrania
        if: inputs.mode != 'dry'
        uses: actions/upload-artifact@v4
        with:
          name: ships-models
          path: shared/ships/models/*.glb

      - name: Commit
        if: inputs.mode != 'dry'
        run: |
          rm -f build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add shared/ships/models shared/ships/fleet.js shared/data/races.js
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
          else
            git commit -m "ships: build (${{ inputs.mode }}${{ inputs.only && format(', {0}', inputs.only) || '' }})"
            git push
          fi
