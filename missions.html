<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tablica misji — Teegarden-B</title>
  <meta name="theme-color" content="#05070c" />
  <link rel="preload" href="./cover/fonts/big-shoulders-display-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* te same czcionki i barwy co okładka (index.html) - to jej drugi ekran */
    @font-face { font-family: 'Big Shoulders Display'; font-weight: 800; font-display: swap; src: url('./cover/fonts/big-shoulders-display-latin-800-normal.woff2') format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: 'Big Shoulders Display'; font-weight: 800; font-display: swap; src: url('./cover/fonts/big-shoulders-display-latin-ext-800-normal.woff2') format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
    @font-face { font-family: 'Big Shoulders Display'; font-weight: 500; font-display: swap; src: url('./cover/fonts/big-shoulders-display-latin-500-normal.woff2') format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: 'Big Shoulders Display'; font-weight: 500; font-display: swap; src: url('./cover/fonts/big-shoulders-display-latin-ext-500-normal.woff2') format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
    @font-face { font-family: 'Manrope'; font-weight: 400; font-display: swap; src: url('./cover/fonts/manrope-latin-400-normal.woff2') format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: 'Manrope'; font-weight: 400; font-display: swap; src: url('./cover/fonts/manrope-latin-ext-400-normal.woff2') format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
    @font-face { font-family: 'Manrope'; font-weight: 600; font-display: swap; src: url('./cover/fonts/manrope-latin-600-normal.woff2') format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: 'Manrope'; font-weight: 600; font-display: swap; src: url('./cover/fonts/manrope-latin-ext-600-normal.woff2') format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
    :root {
      --space: #05070c; --ink: #eaf4ff; --ink-dim: #9fb3c6; --hud: #9fd8ff; --ember: #ff7a45;
      --gold: #ffd36b; --foe: #ff5a4d; --friend: #4dd6a0;
      --glass: rgba(6, 14, 24, 0.72); --line: rgba(159, 216, 255, 0.22);
      --display: 'Big Shoulders Display', 'Oswald', 'Arial Narrow', sans-serif;
      --body: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--space); color: var(--ink); font-family: var(--body); }
    body { overflow: hidden; }
    #sky { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at 70% 40%, #10243a 0, var(--space) 60%); }
    #sky canvas { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity 1.4s ease-out; }
    #sky.live canvas { opacity: 1; }
    /* delikatna siatka "stołu taktycznego" nad niebem */
    .grid { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.35;
      background-image: linear-gradient(rgba(159, 216, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(159, 216, 255, 0.05) 1px, transparent 1px);
      background-size: 48px 48px; mask-image: radial-gradient(ellipse at 50% 50%, #000 30%, transparent 80%); }

    main {
      position: relative; z-index: 2; height: 100%; overflow-y: auto;
      display: grid; grid-template-rows: auto 1fr; gap: 1.2rem;
      padding: max(22px, env(safe-area-inset-top)) clamp(16px, 4vw, 64px) max(22px, env(safe-area-inset-bottom));
    }
    header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.4rem 1.4rem; padding-right: 56px; }
    .back { font: 600 0.9rem var(--body); color: var(--ink-dim); text-decoration: none; }
    .back:hover { color: var(--ink); }
    h1 { margin: 0; font: 800 clamp(2.4rem, 6vw, 4rem) / 0.9 var(--display); letter-spacing: 0.01em; }
    h1 span { color: var(--gold); }
    .sys { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--ink-dim); }
    select {
      font: 600 0.88rem var(--body); color: var(--ink); background: var(--glass);
      border: 1px solid var(--line); border-radius: 4px; padding: 0.35rem 0.5rem;
    }

    .board { display: grid; grid-template-columns: minmax(250px, 340px) 1fr; gap: 1.4rem; min-height: 0; align-items: start; }
    .list { display: flex; flex-direction: column; gap: 0.35rem; }
    .m {
      display: grid; grid-template-columns: 1.6rem 1fr auto; align-items: center; gap: 0.1rem 0.7rem;
      width: 100%; padding: 0.6rem 0.75rem; text-align: left; cursor: pointer; font: inherit; color: var(--ink);
      background: rgba(6, 14, 24, 0.45); border: 1px solid transparent; border-left: 2px solid var(--line); border-radius: 3px;
      transition: background 0.12s, border-color 0.12s;
    }
    .m:hover { background: var(--glass); }
    .m[aria-selected="true"] { background: var(--glass); border-color: var(--line); border-left-color: var(--gold); }
    .m .n { font: 800 1.15rem var(--display); color: var(--ink-dim); }
    .m[aria-selected="true"] .n { color: var(--gold); }
    .m b { font-weight: 600; font-size: 0.97rem; }
    .m small { grid-column: 2 / 4; font-size: 0.78rem; color: var(--ink-dim); line-height: 1.35; }
    .threat { display: inline-flex; gap: 3px; }
    .threat i { width: 6px; height: 10px; border-radius: 1px; background: rgba(255, 255, 255, 0.12); }
    .threat i.on { background: var(--foe); box-shadow: 0 0 6px rgba(255, 90, 77, 0.6); }
    .m.free { border-left-color: rgba(77, 214, 160, 0.35); margin-top: 0.4rem; }
    /* krok 11: kampania - gra główna, na górze listy */
    .m.campaign { margin-bottom: 0.5rem; padding-top: 0.8rem; padding-bottom: 0.8rem; border-left-color: rgba(255, 211, 107, 0.6);
      background: linear-gradient(90deg, rgba(255, 211, 107, 0.14), rgba(6, 14, 24, 0.5) 70%); }
    .m.campaign .n { color: var(--gold); font-size: 1.4rem; }
    .m.campaign b { font-family: var(--display); font-weight: 800; font-size: 1.35rem; letter-spacing: 0.02em; }
    .m.campaign[aria-selected="true"] { box-shadow: 0 10px 30px -18px rgba(255, 211, 107, 0.9); }
    .m.free[aria-selected="true"] { border-left-color: var(--friend); }
    :is(.m, .opt, .start, .back, select):focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

    .detail {
      display: grid; grid-template-columns: 1fr minmax(240px, 300px); gap: 1.2rem 1.6rem;
      /* ostatni wiersz 1fr: nadmiar wysokości kolumny wyboru statku idzie pod odprawę,
         a nie w dziurę między schematem a odprawą */
      grid-template-rows: auto auto auto 1fr; align-items: start;
      padding: 1.3rem 1.5rem; border: 1px solid var(--line); border-radius: 10px;
      background: linear-gradient(180deg, rgba(14, 28, 44, 0.78), rgba(4, 10, 18, 0.7));
      box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px) saturate(1.2);
    }
    .detail h2 { grid-column: 1 / -1; margin: 0; font: 800 2.2rem / 1 var(--display); letter-spacing: 0.01em; }
    .setup { grid-row: 3 / span 2; grid-column: 2; }
    .brief { grid-column: 1; grid-row: 4; }
    .tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: -0.6rem; }
    .tags span { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.15rem 0.5rem; border: 1px solid var(--line); border-radius: 99px; color: var(--ink-dim); }
    .schema { grid-column: 1; grid-row: 3; width: 100%; aspect-ratio: 400 / 200; max-height: 34vh; border: 1px solid rgba(159, 216, 255, 0.12); border-radius: 4px; background: rgba(2, 6, 12, 0.55); }
    .brief p { margin: 0 0 0.9rem; line-height: 1.6; color: var(--ink); }
    .brief dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.45rem 1rem; margin: 0; font-size: 0.9rem; line-height: 1.45; }
    .brief dt { font-weight: 600; color: var(--hud); }
    .brief dt.lose { color: var(--foe); }
    .brief dt.tip { color: var(--gold); }
    .brief dd { margin: 0; color: var(--ink-dim); }

    .setup h3 { margin: 0 0 0.45rem; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; }
    .setup section + section { margin-top: 1rem; }
    .opts { display: grid; gap: 0.3rem; }
    .opts.row { grid-template-columns: repeat(3, 1fr); }
    .opt {
      display: grid; grid-template-columns: 0.7rem 1fr; gap: 0 0.55rem; align-items: center;
      padding: 0.45rem 0.6rem; text-align: left; font: inherit; font-size: 0.86rem; color: var(--ink); cursor: pointer;
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 3px;
    }
    .opts.row .opt { grid-template-columns: 1fr; text-align: center; }
    .opts.row .opt span { grid-column: 1; }
    /* wybór statku: rasy (portrety) -> modele wybranej rasy (miniatury 3D) */
    .races { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 0.3rem; }
    .race, .model {
      font: inherit; color: var(--ink); cursor: pointer; text-align: center;
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 3px;
    }
    .race { display: grid; justify-items: center; gap: 0.2rem; padding: 0.5rem 0.3rem 0.4rem; }
    .race .pic { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1); transition: box-shadow 0.2s; }
    .race .pic svg { display: block; width: 100%; height: 100%; }
    .race b { font-size: 0.82rem; font-weight: 600; }
    .race small { font-size: 0.68rem; color: var(--ink-dim); }
    .race:hover, .model:hover { border-color: var(--line); }
    .race[aria-pressed="true"] { border-color: var(--c); background: rgba(159, 216, 255, 0.08); background: color-mix(in srgb, var(--c) 12%, transparent); }
    .race[aria-pressed="true"] .pic { box-shadow: 0 0 0 2px var(--c), 0 0 14px var(--c); }
    .hulls { margin-top: 0.4rem; padding: 0.5rem 0.55rem 0.55rem; border: 1px solid rgba(255, 255, 255, 0.06); border-left: 2px solid var(--c, var(--hud)); border-radius: 3px; background: rgba(255, 255, 255, 0.02); }
    .hulls .race-stats { margin: 0 0 0.2rem; font-size: 0.72rem; color: var(--ink-dim); }
    .hulls h4 { margin: 0.45rem 0 0.3rem; font: 600 0.78rem var(--body); letter-spacing: 0.06em; color: var(--c, var(--ink)); }
    .models { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 0.3rem; }
    .model { display: grid; gap: 0.15rem; padding: 0.25rem 0.25rem 0.35rem; font-size: 0.72rem; line-height: 1.2; }
    .model .thumb { display: block; aspect-ratio: 5 / 3; background: radial-gradient(ellipse at 50% 60%, rgba(159, 216, 255, 0.09), transparent 70%); }
    .model .thumb.none { background: radial-gradient(circle at 50% 50%, var(--c) 0 4px, transparent 5px), radial-gradient(ellipse at 50% 60%, rgba(159, 216, 255, 0.09), transparent 70%); }
    .model img { display: block; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 0.4s; }
    .model img.ok { opacity: 1; }
    .model[aria-pressed="true"] { border-color: var(--c); background: rgba(159, 216, 255, 0.1); background: color-mix(in srgb, var(--c) 14%, transparent); }
    .opt:hover { border-color: var(--line); }
    .opt[aria-pressed="true"] { border-color: var(--hud); background: rgba(159, 216, 255, 0.1); }
    .opt i { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
    .opt span { font-size: 0.74rem; color: var(--ink-dim); grid-column: 2; }
    .opt kbd { font: 600 0.7rem var(--body); color: var(--ink-dim); margin-left: 0.3rem; }
    .opt[disabled] { opacity: 0.55; cursor: default; }
    .start {
      width: 100%; margin-top: 1.2rem; padding: 0.8rem 1rem 0.75rem; border: 0; border-radius: 3px; cursor: pointer;
      font: 800 1.7rem var(--display); letter-spacing: 0.04em; color: var(--space); background: var(--gold);
      box-shadow: 0 10px 40px -12px rgba(255, 211, 107, 0.8); transition: transform 0.12s;
    }
    .start:hover { transform: translateY(-1px); }
    .start small { font: 600 0.75rem var(--body); letter-spacing: 0; opacity: 0.7; margin-left: 0.4rem; }
    .keys { margin: 0.6rem 0 0; font-size: 0.74rem; color: var(--ink-dim); line-height: 1.5; }

    /* schemat taktyczny */
    .schema .p { fill: var(--hud); stroke: var(--hud); }
    .schema .h { fill: var(--foe); stroke: var(--foe); }
    .schema .a { fill: var(--friend); stroke: var(--friend); }
    .schema .t { fill: var(--gold); stroke: var(--gold); }
    .schema .ring { fill: none; stroke-width: 1; stroke-dasharray: 3 4; opacity: 0.7; }
    .schema .path { fill: none; stroke-width: 1.4; stroke-dasharray: 5 6; animation: march 1.2s linear infinite; }
    .schema .ghost { opacity: 0.28; }
    .schema text { font: 600 9px var(--body); fill: var(--ink-dim); stroke: none; letter-spacing: 0.04em; }
    .schema text.k { fill: currentColor; }
    .schema .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
    .schema .drift { animation: drift 3.2s ease-in-out infinite alternate; }
    @keyframes march { to { stroke-dashoffset: -22; } }
    @keyframes pulse { 50% { transform: scale(1.35); opacity: 0.6; } }
    @keyframes drift { to { transform: translateX(10px); } }

    .board > *, .detail > * { min-width: 0; }
    @media (max-width: 1100px) { .detail { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; } .schema, .setup, .brief { grid-column: 1; grid-row: auto; } }
    @media (max-width: 760px) {
      .board { grid-template-columns: minmax(0, 1fr); }
      .detail { padding: 1rem; }
      .detail h2 { font-size: 1.8rem; }
      .sys { margin-left: 0; }
      .schema { max-height: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .schema .path, .schema .pulse, .schema .drift { animation: none; }
      #sky canvas { transition: none; }
    }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="sky" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>

  <main>
    <header>
      <a class="back" id="back" href="./index.html">← Teegarden-B</a>
      <h1>Tablica <span>misji</span></h1>
      <label class="sys">Układ <select id="system"></select></label>
    </header>

    <div class="board">
      <div class="list" id="list" role="listbox" aria-label="Misje"></div>
      <article class="detail" id="detail" aria-live="polite">
        <h2 id="d-name"></h2>
        <div class="tags" id="d-tags"></div>
        <svg class="schema" id="d-schema" viewBox="0 0 400 200" role="img"></svg>
        <div class="brief">
          <p id="d-brief"></p>
          <dl>
            <dt>Cel</dt><dd id="d-win"></dd>
            <dt class="lose">Porażka</dt><dd id="d-lose"></dd>
            <dt class="tip">Wskazówka</dt><dd id="d-tip"></dd>
          </dl>
        </div>
        <div class="setup">
          <section><h3>Rasa załogi i statek — na całą misję</h3><div class="races" id="races"></div><div class="hulls" id="hulls"></div></section>
          <section><h3>Przeciwnicy</h3><div class="opts row" id="diff"></div></section>
          <section><h3>Wataha</h3><div class="opts" id="pack"></div></section>
          <button class="start" id="start" type="button">Start <small>Enter</small></button>
          <p class="keys">↑ ↓ — misja · statek: rasa, potem model · T — trudność · W — wataha · Esc — powrót</p>
        </div>
      </article>
    </div>
  </main>

  <script type="module" src="./cover/missions.js"></script>
</body>
</html>
